<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'DM Sans', system-ui, sans-serif; }
    a { color: #C4622D; } a:hover { color: #A8511F; }
  </style>
</helmet>
<div style="width: 1080px; height: 1080px; background: #1A5C5E; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; padding: 80px;">

  <!-- Subtle grid pattern -->
  <div style="position: absolute; inset: 0; background-image: linear-gradient(rgba(232,219,197,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(232,219,197,0.04) 1px, transparent 1px); background-size: 60px 60px;"></div>

  <!-- Top badge -->
  <div style="position: relative; z-index: 1; display: flex; align-items: center; gap: 16px; margin-bottom: 48px;">
    <div style="width: 48px; height: 1px; background: rgba(232,219,197,0.3);"></div>
    <div style="font-family: 'DM Sans', sans-serif; font-size: 16px; font-weight: 600; letter-spacing: 4px; text-transform: uppercase; color: #8BA888;">Guide Nutrition</div>
    <div style="width: 48px; height: 1px; background: rgba(232,219,197,0.3);"></div>
  </div>

  <!-- Large number -->
  <div style="font-family: 'Playfair Display', Georgia, serif; font-size: 180px; font-weight: 700; color: rgba(232,219,197,0.12); line-height: 1; position: relative; z-index: 1; margin-bottom: -40px;">5</div>

  <!-- Title -->
  <div style="position: relative; z-index: 2; text-align: center; max-width: 800px;">
    <div style="font-family: 'Playfair Display', Georgia, serif; font-size: 52px; font-weight: 700; color: #F7F5F0; line-height: 1.2; margin-bottom: 8px; text-wrap: balance;">signes que les croquettes de votre chien</div>
    <div style="font-family: 'Playfair Display', Georgia, serif; font-size: 52px; font-weight: 700; font-style: italic; color: #E8DBC5; line-height: 1.2;">ne lui conviennent pas</div>
  </div>

  <!-- Paw icon -->
  <svg style="margin: 40px 0; position: relative; z-index: 1;" width="36" height="36" viewBox="0 0 48 48" fill="none">
    <ellipse cx="24" cy="34" rx="10" ry="8" fill="#C4622D" opacity="0.9"/>
    <circle cx="14" cy="20" r="5" fill="#C4622D" opacity="0.9"/>
    <circle cx="24" cy="16" r="5" fill="#C4622D" opacity="0.9"/>
    <circle cx="34" cy="20" r="5" fill="#C4622D" opacity="0.9"/>
  </svg>

  <!-- Swipe CTA -->
  <div style="display: flex; align-items: center; gap: 12px; position: relative; z-index: 1;">
    <div style="font-family: 'DM Sans', sans-serif; font-size: 18px; font-weight: 500; color: rgba(247,245,240,0.7);">Swipez pour d&#233;couvrir</div>
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
      <path d="M5 12h14M13 6l6 6-6 6" stroke="rgba(247,245,240,0.7)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <!-- Bottom branding -->
  <div style="position: absolute; bottom: 40px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 8px;">
    <svg width="16" height="16" viewBox="0 0 48 48" fill="none">
      <ellipse cx="24" cy="34" rx="10" ry="8" fill="#E8DBC5" opacity="0.6"/>
      <circle cx="14" cy="20" r="5" fill="#E8DBC5" opacity="0.6"/>
      <circle cx="24" cy="16" r="5" fill="#E8DBC5" opacity="0.6"/>
      <circle cx="34" cy="20" r="5" fill="#E8DBC5" opacity="0.6"/>
    </svg>
    <div style="font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; color: rgba(247,245,240,0.4); letter-spacing: 2px;">PETFACTORY MARRAKECH</div>
  </div>
</div>
</x-dc>
</body>
</html>
