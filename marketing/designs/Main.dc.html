<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'DM Sans', system-ui, sans-serif; }
    a { color: #C4622D; } a:hover { color: #A8511F; }
  </style>
</helmet>
<div style="width: 1080px; height: 1080px; background: #1A5C5E; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden;">
  <!-- Decorative circles -->
  <div style="position: absolute; top: -120px; right: -80px; width: 400px; height: 400px; border-radius: 50%; border: 1px solid rgba(232,219,197,0.12);"></div>
  <div style="position: absolute; bottom: -100px; left: -60px; width: 320px; height: 320px; border-radius: 50%; border: 1px solid rgba(232,219,197,0.08);"></div>
  <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 600px; height: 600px; border-radius: 50%; border: 1px solid rgba(232,219,197,0.06);"></div>

  <!-- Eyebrow -->
  <div style="font-family: 'DM Sans', sans-serif; font-size: 18px; font-weight: 600; letter-spacing: 6px; text-transform: uppercase; color: #8BA888; margin-bottom: 40px; position: relative; z-index: 1;">NOUVELLE OUVERTURE</div>

  <!-- Paw icon -->
  <svg style="margin-bottom: 32px; position: relative; z-index: 1;" width="48" height="48" viewBox="0 0 48 48" fill="none">
    <ellipse cx="24" cy="34" rx="10" ry="8" fill="#E8DBC5" opacity="0.9"/>
    <circle cx="14" cy="20" r="5" fill="#E8DBC5" opacity="0.9"/>
    <circle cx="24" cy="16" r="5" fill="#E8DBC5" opacity="0.9"/>
    <circle cx="34" cy="20" r="5" fill="#E8DBC5" opacity="0.9"/>
  </svg>

  <!-- Store name -->
  <div style="font-family: 'Playfair Display', Georgia, serif; font-size: 96px; font-weight: 700; color: #F7F5F0; line-height: 1; text-align: center; position: relative; z-index: 1; margin-bottom: 8px;">PetFactory</div>

  <!-- Marrakesh -->
  <div style="font-family: 'Playfair Display', Georgia, serif; font-size: 42px; font-weight: 400; font-style: italic; color: #E8DBC5; text-align: center; position: relative; z-index: 1; margin-bottom: 48px;">Marrakesh</div>

  <!-- Location -->
  <div style="display: flex; align-items: center; gap: 12px; position: relative; z-index: 1; margin-bottom: 16px;">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
      <path d="M10 2C6.69 2 4 4.69 4 8c0 4.5 6 10 6 10s6-5.5 6-10c0-3.31-2.69-6-6-6zm0 8.5a2.5 2.5 0 110-5 2.5 2.5 0 010 5z" fill="#C4622D"/>
    </svg>
    <div style="font-family: 'DM Sans', sans-serif; font-size: 22px; font-weight: 500; color: rgba(247,245,240,0.85); letter-spacing: 1px;">Route de F&#232;s, Marrakech</div>
  </div>

  <!-- Divider -->
  <div style="width: 60px; height: 2px; background: #C4622D; margin: 24px 0; position: relative; z-index: 1;"></div>

  <!-- Opening date -->
  <div style="font-family: 'DM Sans', sans-serif; font-size: 20px; font-weight: 600; color: #F7F5F0; letter-spacing: 3px; text-transform: uppercase; position: relative; z-index: 1;">Septembre 2026</div>

  <!-- Bottom bar -->
  <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 6px; background: #C4622D;"></div>
</div>
</x-dc>
</body>
</html>
