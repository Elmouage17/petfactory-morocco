<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'DM Sans', system-ui, sans-serif; }
    a { color: #C4622D; } a:hover { color: #A8511F; }
  </style>
</helmet>
<div style="width: 1080px; height: 1080px; background: #E8DBC5; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; padding: 100px;">

  <!-- Subtle texture overlay -->
  <div style="position: absolute; inset: 0; background-image: radial-gradient(circle at 20% 80%, rgba(26,92,94,0.03) 0%, transparent 60%), radial-gradient(circle at 80% 20%, rgba(196,98,45,0.03) 0%, transparent 60%);"></div>

  <!-- Top line -->
  <div style="position: absolute; top: 60px; left: 100px; right: 100px; height: 1px; background: rgba(26,92,94,0.15);"></div>

  <!-- Stars -->
  <div style="display: flex; gap: 8px; margin-bottom: 40px; position: relative; z-index: 1;">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="#C4622D"><path d="M12 2l2.4 7.4H22l-6.2 4.5L18.2 21 12 16.5 5.8 21l2.4-7.1L2 9.4h7.6z"/></svg>
    <svg width="24" height="24" viewBox="0 0 24 24" fill="#C4622D"><path d="M12 2l2.4 7.4H22l-6.2 4.5L18.2 21 12 16.5 5.8 21l2.4-7.1L2 9.4h7.6z"/></svg>
    <svg width="24" height="24" viewBox="0 0 24 24" fill="#C4622D"><path d="M12 2l2.4 7.4H22l-6.2 4.5L18.2 21 12 16.5 5.8 21l2.4-7.1L2 9.4h7.6z"/></svg>
    <svg width="24" height="24" viewBox="0 0 24 24" fill="#C4622D"><path d="M12 2l2.4 7.4H22l-6.2 4.5L18.2 21 12 16.5 5.8 21l2.4-7.1L2 9.4h7.6z"/></svg>
    <svg width="24" height="24" viewBox="0 0 24 24" fill="#C4622D"><path d="M12 2l2.4 7.4H22l-6.2 4.5L18.2 21 12 16.5 5.8 21l2.4-7.1L2 9.4h7.6z"/></svg>
  </div>

  <!-- Large quote mark -->
  <div style="font-family: 'Playfair Display', Georgia, serif; font-size: 200px; font-weight: 700; color: rgba(26,92,94,0.12); line-height: 0.6; position: relative; z-index: 1; margin-bottom: 16px;">&#8220;</div>

  <!-- Quote text -->
  <div style="font-family: 'Playfair Display', Georgia, serif; font-size: 36px; font-weight: 400; font-style: italic; color: #1C1F1E; text-align: center; line-height: 1.5; max-width: 780px; position: relative; z-index: 1; margin-bottom: 40px; text-wrap: balance;">Enfin une animalerie s&#233;rieuse &#224; Marrakech. L&#8217;&#233;quipe m&#8217;a aid&#233; &#224; trouver l&#8217;alimentation parfaite pour Luna. En 2 semaines, plus de probl&#232;mes de digestion.</div>

  <!-- Divider -->
  <div style="width: 48px; height: 2px; background: #C4622D; margin-bottom: 24px; position: relative; z-index: 1;"></div>

  <!-- Customer name -->
  <div style="text-align: center; position: relative; z-index: 1;">
    <div style="font-family: 'DM Sans', sans-serif; font-size: 18px; font-weight: 600; color: #1C1F1E; letter-spacing: 1px;">Nadia K.</div>
    <div style="font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 400; color: #3A3F3E; margin-top: 4px;">R&#233;sidente de Targa</div>
  </div>

  <!-- Bottom line -->
  <div style="position: absolute; bottom: 60px; left: 100px; right: 100px; height: 1px; background: rgba(26,92,94,0.15);"></div>

  <!-- Bottom branding -->
  <div style="position: absolute; bottom: 36px; display: flex; align-items: center; gap: 12px;">
    <svg width="16" height="16" viewBox="0 0 48 48" fill="none">
      <ellipse cx="24" cy="34" rx="10" ry="8" fill="#1A5C5E" opacity="0.5"/>
      <circle cx="14" cy="20" r="5" fill="#1A5C5E" opacity="0.5"/>
      <circle cx="24" cy="16" r="5" fill="#1A5C5E" opacity="0.5"/>
      <circle cx="34" cy="20" r="5" fill="#1A5C5E" opacity="0.5"/>
    </svg>
    <div style="font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; color: rgba(28,31,30,0.4); letter-spacing: 2px;">PETFACTORY MARRAKECH</div>
  </div>
</div>
</x-dc>
</body>
</html>
