<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0F1A2E; overflow: hidden; font-family: 'Arial', sans-serif; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width = 1920;
canvas.height = 1080;

const C = {
  navy: '#1B2A4A', teal: '#2E86AB', amber: '#E8963E', white: '#FFFFFF',
  green: '#27AE60', darkBg: '#0F1A2E', lightTeal: '#D6EFF8',
  red: '#C0392B', orange: '#E67E22', darkTeal: '#1A6B8A',
  steam: 'rgba(200,220,240,0.3)', particle: '#E8963E',
};

let frame = 0;
const totalFrames = 30 * 20; // 20 seconds at 30fps

// Production stages
const stages = [
  { name: 'Matières\nPremières', color: '#1B2A4A', spec: '10% humidité', icon: 'grain' },
  { name: 'Pré-\nconditionneur', color: '#1A6B8A', spec: '350 kg/h vapeur', icon: 'steam' },
  { name: 'Extrudeuse\nSJPS165', color: '#2E86AB', spec: '203 kW / 145°C', icon: 'screw' },
  { name: 'Séchoir\nGZDH2200', color: '#E8963E', spec: '140°C / 44 m²', icon: 'heat' },
  { name: 'Refroidisseur', color: '#5B9BD5', spec: '12 min séjour', icon: 'cool' },
  { name: 'Enrobeur', color: '#7C68AE', spec: '12% MG', icon: 'coat' },
  { name: 'Conditionnement', color: '#27AE60', spec: '20°C / 45% HR', icon: 'pack' },
];

// Particles flowing between stages
class Particle {
  constructor(startX, startY, endX, endY, color, delay) {
    this.startX = startX; this.startY = startY;
    this.endX = endX; this.endY = endY;
    this.color = color; this.delay = delay;
    this.speed = 0.008 + Math.random() * 0.006;
    this.progress = 0;
    this.size = 3 + Math.random() * 4;
    this.active = false;
  }
  update(f) {
    if (f < this.delay) return;
    this.active = true;
    this.progress += this.speed;
    if (this.progress > 1) this.progress = 0;
  }
  draw() {
    if (!this.active) return;
    const t = this.progress;
    const x = this.startX + (this.endX - this.startX) * t;
    const y = this.startY + (this.endY - this.startY) * t + Math.sin(t * Math.PI * 4) * 3;
    ctx.beginPath();
    ctx.arc(x, y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = this.color;
    ctx.globalAlpha = 0.7 + Math.sin(t * Math.PI) * 0.3;
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

// Steam particles
class SteamParticle {
  constructor(x, y) {
    this.baseX = x; this.baseY = y;
    this.x = x; this.y = y;
    this.vx = (Math.random() - 0.5) * 0.8;
    this.vy = -0.5 - Math.random() * 1.5;
    this.life = 1;
    this.decay = 0.008 + Math.random() * 0.012;
    this.size = 4 + Math.random() * 8;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life -= this.decay;
    if (this.life <= 0) {
      this.x = this.baseX + (Math.random() - 0.5) * 20;
      this.y = this.baseY;
      this.life = 1;
      this.vx = (Math.random() - 0.5) * 0.8;
      this.vy = -0.5 - Math.random() * 1.5;
    }
  }
  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * this.life, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(200,220,240,${this.life * 0.25})`;
    ctx.fill();
  }
}

// Create particles between stages
const particles = [];
const stageW = 200;
const stageGap = 35;
const stageStartX = 95;
const stageY = 420;

for (let i = 0; i < stages.length - 1; i++) {
  const sx = stageStartX + i * (stageW + stageGap) + stageW;
  const ex = stageStartX + (i + 1) * (stageW + stageGap);
  for (let j = 0; j < 8; j++) {
    particles.push(new Particle(
      sx, stageY + 60 + Math.random() * 40,
      ex, stageY + 60 + Math.random() * 40,
      stages[i].color, j * 15 + i * 30
    ));
  }
}

// Steam particles for preconditioner and dryer
const steamParticles = [];
for (let i = 0; i < 30; i++) {
  steamParticles.push(new SteamParticle(
    stageStartX + 1 * (stageW + stageGap) + stageW / 2 + (Math.random() - 0.5) * 60,
    stageY - 10
  ));
  steamParticles.push(new SteamParticle(
    stageStartX + 3 * (stageW + stageGap) + stageW / 2 + (Math.random() - 0.5) * 60,
    stageY - 10
  ));
}

// Animated counters
function animateValue(target, f, startFrame, duration) {
  if (f < startFrame) return 0;
  const progress = Math.min((f - startFrame) / duration, 1);
  const eased = 1 - Math.pow(1 - progress, 3);
  return target * eased;
}

// Draw rounded rect
function roundRect(x, y, w, h, r, fill, stroke) {
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke(); }
}

// Draw pulsing glow
function drawGlow(x, y, w, h, color, intensity) {
  const grad = ctx.createRadialGradient(x + w/2, y + h/2, 0, x + w/2, y + h/2, Math.max(w, h));
  grad.addColorStop(0, color + Math.floor(intensity * 40).toString(16).padStart(2, '0'));
  grad.addColorStop(1, color + '00');
  ctx.fillStyle = grad;
  ctx.fillRect(x - 20, y - 20, w + 40, h + 40);
}

// Draw conveyor belt
function drawConveyor(x, y, w, f) {
  const beltY = y + 140;
  ctx.fillStyle = '#2A3A5A';
  ctx.fillRect(x, beltY, w, 12);
  // Moving lines
  const spacing = 20;
  ctx.strokeStyle = '#3A4A6A';
  ctx.lineWidth = 1.5;
  for (let i = 0; i < w / spacing + 1; i++) {
    const lx = x + ((i * spacing + f * 1.5) % w);
    if (lx >= x && lx <= x + w) {
      ctx.beginPath();
      ctx.moveTo(lx, beltY + 1);
      ctx.lineTo(lx, beltY + 11);
      ctx.stroke();
    }
  }
}

// Draw equipment animation inside stage
function drawEquipment(stage, x, y, w, h, f) {
  const cx = x + w / 2;
  const cy = y + h / 2 + 10;

  switch(stage.icon) {
    case 'grain':
      // Falling grain dots
      for (let i = 0; i < 12; i++) {
        const gy = cy - 20 + ((f * 2 + i * 15) % 60);
        const gx = cx - 30 + (i * 8) % 60 + Math.sin(f * 0.05 + i) * 5;
        ctx.beginPath();
        ctx.arc(gx, gy, 3, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(232,150,62,${0.5 + Math.sin(f * 0.1 + i) * 0.3})`;
        ctx.fill();
      }
      break;
    case 'steam':
      // Mixing animation
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(f * 0.04);
      for (let i = 0; i < 4; i++) {
        ctx.rotate(Math.PI / 2);
        ctx.fillStyle = `rgba(255,255,255,0.15)`;
        ctx.fillRect(-5, -30, 10, 25);
      }
      ctx.restore();
      break;
    case 'screw':
      // Twin screw rotation
      ctx.save();
      ctx.translate(cx, cy);
      for (let s = -1; s <= 1; s += 2) {
        for (let i = 0; i < 6; i++) {
          const angle = f * 0.08 + i * Math.PI / 3;
          const sx = Math.cos(angle) * 18 + s * 15;
          const sy = Math.sin(angle) * 18;
          ctx.beginPath();
          ctx.arc(sx, sy, 6, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(46,134,171,${0.3 + Math.sin(angle) * 0.2})`;
          ctx.fill();
        }
      }
      ctx.restore();
      // Heat indicator
      const heatPulse = 0.5 + Math.sin(f * 0.06) * 0.3;
      ctx.fillStyle = `rgba(255,100,50,${heatPulse * 0.15})`;
      ctx.fillRect(x + 10, y + 10, w - 20, h - 20);
      break;
    case 'heat':
      // Heat waves
      for (let i = 0; i < 5; i++) {
        const hy = cy + 20 - ((f + i * 20) % 50);
        const alpha = 1 - ((f + i * 20) % 50) / 50;
        ctx.beginPath();
        ctx.moveTo(cx - 40, hy);
        for (let j = 0; j < 80; j++) {
          ctx.lineTo(cx - 40 + j, hy + Math.sin(j * 0.15 + f * 0.1) * 4);
        }
        ctx.strokeStyle = `rgba(232,150,62,${alpha * 0.4})`;
        ctx.lineWidth = 2;
        ctx.stroke();
      }
      break;
    case 'cool':
      // Cool air circulation
      for (let i = 0; i < 8; i++) {
        const angle = f * 0.03 + i * Math.PI / 4;
        const r = 20 + Math.sin(f * 0.05 + i) * 10;
        ctx.beginPath();
        ctx.arc(cx + Math.cos(angle) * r, cy + Math.sin(angle) * r, 4, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(91,155,213,${0.3 + Math.sin(angle) * 0.2})`;
        ctx.fill();
      }
      break;
    case 'coat':
      // Spray coating
      for (let i = 0; i < 10; i++) {
        const angle = -Math.PI / 4 + Math.random() * Math.PI / 2;
        const dist = ((f * 3 + i * 30) % 40);
        const px = cx + Math.cos(angle) * dist;
        const py = cy - 20 + dist;
        ctx.beginPath();
        ctx.arc(px, py, 2, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(124,104,174,${0.5 - dist / 80})`;
        ctx.fill();
      }
      break;
    case 'pack':
      // Package forming
      const packPhase = (f * 0.02) % 1;
      const packH = 30 * Math.min(packPhase * 2, 1);
      ctx.fillStyle = `rgba(39,174,96,0.3)`;
      ctx.fillRect(cx - 20, cy + 15 - packH, 40, packH);
      ctx.strokeStyle = `rgba(39,174,96,0.6)`;
      ctx.lineWidth = 1.5;
      ctx.strokeRect(cx - 20, cy + 15 - packH, 40, packH);
      break;
  }
}

// Main render
function render() {
  const f = frame;

  // Background
  ctx.fillStyle = C.darkBg;
  ctx.fillRect(0, 0, 1920, 1080);

  // Subtle grid
  ctx.strokeStyle = 'rgba(46,134,171,0.05)';
  ctx.lineWidth = 1;
  for (let x = 0; x < 1920; x += 40) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 1080); ctx.stroke();
  }
  for (let y = 0; y < 1080; y += 40) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1920, y); ctx.stroke();
  }

  // Title area
  const titleAlpha = Math.min(f / 30, 1);
  ctx.globalAlpha = titleAlpha;

  // Logo area
  roundRect(40, 30, 8, 50, 2, C.amber);
  ctx.font = 'bold 36px Arial';
  ctx.fillStyle = C.white;
  ctx.fillText('PETFACTORY MAROC', 65, 68);
  ctx.font = '16px Arial';
  ctx.fillStyle = '#6B7B8D';
  ctx.fillText('Simulation de Production  |  Ligne d\'Extrusion Sèche 5 T/h  |  FAMSUN Clé en Main', 65, 95);

  // Top-right live stats
  ctx.font = 'bold 14px Arial';
  ctx.fillStyle = C.amber;
  const statusPulse = Math.sin(f * 0.08) > 0 ? '●' : '○';
  ctx.fillText(`${statusPulse}  EN PRODUCTION`, 1680, 50);
  ctx.font = '12px Arial';
  ctx.fillStyle = '#6B7B8D';
  const hours = Math.floor((f / 30) % 24);
  const mins = Math.floor((f / 30 * 60) % 60);
  ctx.fillText(`${String(hours).padStart(2,'0')}:${String(mins).padStart(2,'0')} — Août 2026`, 1700, 70);

  ctx.globalAlpha = 1;

  // Phase intro animations
  const phase1Start = 30;   // stages appear
  const phase2Start = 90;   // particles start
  const phase3Start = 150;  // dashboard appears

  // Draw production stages
  for (let i = 0; i < stages.length; i++) {
    const stageAppear = Math.min((f - phase1Start - i * 8) / 20, 1);
    if (stageAppear <= 0) continue;

    const s = stages[i];
    const sx = stageStartX + i * (stageW + stageGap);
    const sy = stageY;
    const sw = stageW;
    const sh = 160;

    ctx.globalAlpha = stageAppear;

    // Glow effect for active stages
    const pulse = 0.5 + Math.sin(f * 0.05 + i * 0.5) * 0.3;
    drawGlow(sx, sy, sw, sh, s.color, pulse);

    // Stage card
    roundRect(sx, sy, sw, sh, 10, s.color + 'DD');
    roundRect(sx, sy, sw, sh, 10, null, s.color);

    // Stage number
    ctx.font = 'bold 14px Arial';
    ctx.fillStyle = `rgba(255,255,255,0.4)`;
    ctx.textAlign = 'center';
    ctx.fillText(`${i + 1}`, sx + sw / 2, sy + 22);

    // Stage name
    ctx.font = 'bold 15px Arial';
    ctx.fillStyle = C.white;
    const lines = s.name.split('\n');
    lines.forEach((line, li) => {
      ctx.fillText(line, sx + sw / 2, sy + 48 + li * 18);
    });

    // Spec
    ctx.font = '11px Arial';
    ctx.fillStyle = `rgba(255,255,255,0.7)`;
    ctx.fillText(s.spec, sx + sw / 2, sy + sh - 15);

    ctx.textAlign = 'left';

    // Equipment animation inside
    drawEquipment(s, sx, sy, sw, sh, f);

    // Conveyor belt
    drawConveyor(sx, sy, sw, f);

    // Arrow between stages
    if (i < stages.length - 1) {
      const ax = sx + sw + 5;
      const ay = sy + sh / 2;
      ctx.beginPath();
      ctx.moveTo(ax, ay - 8);
      ctx.lineTo(ax + stageGap - 10, ay);
      ctx.lineTo(ax, ay + 8);
      ctx.fillStyle = `rgba(255,255,255,${0.15 + pulse * 0.15})`;
      ctx.fill();
    }

    ctx.globalAlpha = 1;
  }

  // Draw steam particles
  if (f > phase2Start) {
    steamParticles.forEach(p => { p.update(); p.draw(); });
  }

  // Draw flow particles
  if (f > phase2Start) {
    particles.forEach(p => { p.update(f - phase2Start); p.draw(); });
  }

  // Bottom dashboard
  if (f > phase3Start) {
    const dashAlpha = Math.min((f - phase3Start) / 40, 1);
    ctx.globalAlpha = dashAlpha;

    // Dashboard background
    roundRect(40, 640, 1840, 410, 15, 'rgba(27,42,74,0.6)');
    roundRect(40, 640, 1840, 410, 15, null, 'rgba(46,134,171,0.2)');

    // Dashboard title
    ctx.font = 'bold 20px Arial';
    ctx.fillStyle = C.white;
    ctx.fillText('Tableau de Bord de Production', 80, 678);

    ctx.font = '12px Arial';
    ctx.fillStyle = '#6B7B8D';
    ctx.fillText('Données temps réel — Simulation', 360, 678);

    // Stat cards
    const stats = [
      { label: 'Débit', value: animateValue(5.0, f, phase3Start, 60).toFixed(1), unit: 'T/h', color: C.teal },
      { label: 'Temp. Extrudeuse', value: Math.floor(animateValue(145, f, phase3Start, 60) + Math.sin(f*0.1)*2), unit: '°C', color: C.amber },
      { label: 'Vapeur', value: animateValue(2.45, f, phase3Start, 60).toFixed(2), unit: 'T/h', color: C.teal },
      { label: 'Humidité Sortie', value: animateValue(9.0, f, phase3Start, 60).toFixed(1), unit: '%', color: C.green },
      { label: 'Activité Eau', value: animateValue(0.58, f, phase3Start, 60).toFixed(2), unit: 'aw', color: C.green },
      { label: 'Énergie', value: Math.floor(animateValue(203, f, phase3Start, 60) + Math.sin(f*0.07)*5), unit: 'kW', color: C.orange },
    ];

    stats.forEach((s, i) => {
      const sx = 80 + i * 300;
      const sy = 710;

      roundRect(sx, sy, 270, 90, 8, 'rgba(15,26,46,0.8)');

      ctx.font = '12px Arial';
      ctx.fillStyle = '#6B7B8D';
      ctx.fillText(s.label, sx + 15, sy + 25);

      ctx.font = 'bold 36px Arial';
      ctx.fillStyle = s.color;
      ctx.fillText(String(s.value), sx + 15, sy + 68);

      ctx.font = '14px Arial';
      ctx.fillStyle = '#6B7B8D';
      ctx.fillText(s.unit, sx + 15 + ctx.measureText(String(s.value)).width + 8, sy + 68);
    });

    // Process flow bar chart
    const chartX = 80;
    const chartY = 830;
    const chartW = 880;
    const chartH = 180;

    roundRect(chartX, chartY, chartW, chartH, 8, 'rgba(15,26,46,0.6)');

    ctx.font = 'bold 13px Arial';
    ctx.fillStyle = '#8899AA';
    ctx.fillText('Flux de Production par Étape (T/h)', chartX + 15, chartY + 25);

    const barData = [5.0, 4.8, 5.0, 4.9, 4.8, 4.7, 4.5];
    const barW = 90;
    const barGap = 18;
    const maxBar = 5.5;
    const barAreaY = chartY + 45;
    const barAreaH = chartH - 70;

    barData.forEach((v, i) => {
      const bx = chartX + 30 + i * (barW + barGap);
      const animV = animateValue(v, f, phase3Start + 30, 40);
      const bh = (animV / maxBar) * barAreaH;
      const by = barAreaY + barAreaH - bh;

      // Bar with gradient
      const grad = ctx.createLinearGradient(bx, by, bx, barAreaY + barAreaH);
      grad.addColorStop(0, stages[i].color);
      grad.addColorStop(1, stages[i].color + '44');
      ctx.fillStyle = grad;
      roundRect(bx, by, barW, bh, 4, grad);

      // Value on top
      ctx.font = 'bold 11px Arial';
      ctx.fillStyle = C.white;
      ctx.textAlign = 'center';
      ctx.fillText(animV.toFixed(1), bx + barW / 2, by - 6);

      // Label
      ctx.font = '9px Arial';
      ctx.fillStyle = '#6B7B8D';
      const shortNames = ['Mat.Prem.', 'Précond.', 'Extrud.', 'Séchoir', 'Refroid.', 'Enrobeur', 'Cond.'];
      ctx.fillText(shortNames[i], bx + barW / 2, barAreaY + barAreaH + 15);
      ctx.textAlign = 'left';
    });

    // Right side — Temperature profile
    const tempX = 1000;
    const tempY = chartY;
    const tempW = 860;
    const tempH = chartH;

    roundRect(tempX, tempY, tempW, tempH, 8, 'rgba(15,26,46,0.6)');

    ctx.font = 'bold 13px Arial';
    ctx.fillStyle = '#8899AA';
    ctx.fillText('Profil de Température (°C)', tempX + 15, tempY + 25);

    const tempData = [25, 85, 145, 140, 35, 30, 20];
    const tempAreaY = tempY + 50;
    const tempAreaH = tempH - 80;
    const maxTemp = 160;
    const pointSpacing = (tempW - 80) / (tempData.length - 1);

    // Grid lines
    ctx.strokeStyle = 'rgba(46,134,171,0.1)';
    ctx.lineWidth = 1;
    for (let t = 0; t <= 160; t += 40) {
      const gy = tempAreaY + tempAreaH - (t / maxTemp) * tempAreaH;
      ctx.beginPath(); ctx.moveTo(tempX + 40, gy); ctx.lineTo(tempX + tempW - 20, gy); ctx.stroke();
      ctx.font = '9px Arial';
      ctx.fillStyle = '#556677';
      ctx.fillText(`${t}°`, tempX + 15, gy + 4);
    }

    // Temperature line
    ctx.beginPath();
    tempData.forEach((t, i) => {
      const animT = animateValue(t, f, phase3Start + 40, 50);
      const px = tempX + 50 + i * pointSpacing;
      const py = tempAreaY + tempAreaH - (animT / maxTemp) * tempAreaH;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    });
    ctx.strokeStyle = C.amber;
    ctx.lineWidth = 3;
    ctx.stroke();

    // Fill under line
    ctx.lineTo(tempX + 50 + (tempData.length - 1) * pointSpacing, tempAreaY + tempAreaH);
    ctx.lineTo(tempX + 50, tempAreaY + tempAreaH);
    ctx.closePath();
    ctx.fillStyle = 'rgba(232,150,62,0.08)';
    ctx.fill();

    // Data points
    tempData.forEach((t, i) => {
      const animT = animateValue(t, f, phase3Start + 40, 50);
      const px = tempX + 50 + i * pointSpacing;
      const py = tempAreaY + tempAreaH - (animT / maxTemp) * tempAreaH;

      ctx.beginPath();
      ctx.arc(px, py, 5, 0, Math.PI * 2);
      ctx.fillStyle = stages[i].color;
      ctx.fill();
      ctx.strokeStyle = C.white;
      ctx.lineWidth = 2;
      ctx.stroke();

      // Point label
      ctx.font = 'bold 10px Arial';
      ctx.fillStyle = C.white;
      ctx.textAlign = 'center';
      ctx.fillText(`${Math.floor(animT)}°`, px, py - 12);
      ctx.textAlign = 'left';
    });

    ctx.globalAlpha = 1;
  }

  // Fade in/out
  if (f < 20) {
    ctx.fillStyle = `rgba(15,26,46,${1 - f / 20})`;
    ctx.fillRect(0, 0, 1920, 1080);
  }
  if (f > totalFrames - 30) {
    ctx.fillStyle = `rgba(15,26,46,${(f - (totalFrames - 30)) / 30})`;
    ctx.fillRect(0, 0, 1920, 1080);
  }

  frame++;
  if (frame <= totalFrames) {
    requestAnimationFrame(render);
  } else {
    document.title = 'DONE';
  }
}

render();
</script>
</body>
</html>
