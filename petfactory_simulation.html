<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<title>PetFactory Morocco - Simulation Ligne de Production</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0e1a; overflow: hidden; }
  canvas { display: block; }
</style>
</head><body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 1920, H = 1080;
canvas.width = W; canvas.height = H;

const C = {
  navy: '#1B2A4A', teal: '#2E86AB', amber: '#E8963E', green: '#27AE60',
  red: '#C0392B', blue: '#5B9BD5', purple: '#7C68AE', offWhite: '#F5F5F5',
  dark: '#0a0e1a', darkPanel: '#111827', cardBg: '#1a2236', gridLine: '#1e2d4a',
  steel: '#8899AA', lightSteel: '#B0BEC5', warmGray: '#9E9E9E',
  grain: '#D4A056', kibble: '#8B6914', orange: '#E67E22'
};

const DURATION = 62;
let startTime = null;

const FLOOR_Y = 570;
const UTIL_Y = 600;
const EQ = {
  silos:    { x: 60,   y: 200, w: 160, h: 370 },
  hammer:   { x: 250,  y: 330, w: 90,  h: 170 },
  mixer:    { x: 370,  y: 350, w: 130, h: 90 },
  precon:   { x: 530,  y: 310, w: 160, h: 100 },
  extruder: { x: 720,  y: 300, w: 240, h: 130 },
  dryer:    { x: 1000, y: 260, w: 260, h: 180 },
  cooler:   { x: 1300, y: 220, w: 120, h: 310 },
  coater:   { x: 1460, y: 330, w: 150, h: 110 },
  packer:   { x: 1660, y: 290, w: 130, h: 240 },
  boiler:   { x: 450,  y: 600, w: 180, h: 140 },
  compressor:{ x: 1100, y: 610, w: 160, h: 120 },
};

function lerp(a, b, t) { return a + (b - a) * t; }

function drawSilos(t) {
  const e = EQ.silos;
  ctx.save();
  for (let i = 0; i < 2; i++) {
    const sx = e.x + i * 85;
    const sw = 70, sh = 220, sy = e.y + 40;
    const grad = ctx.createLinearGradient(sx, sy, sx + sw, sy);
    grad.addColorStop(0, '#6B7B8D'); grad.addColorStop(0.3, '#A8B8C8');
    grad.addColorStop(0.5, '#C8D4DE'); grad.addColorStop(0.7, '#A8B8C8'); grad.addColorStop(1, '#6B7B8D');
    ctx.beginPath();
    ctx.ellipse(sx + sw/2, sy + 10, sw/2, 18, 0, Math.PI, 0);
    ctx.fillStyle = grad; ctx.fill();
    ctx.strokeStyle = '#4A5568'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = grad; ctx.fillRect(sx, sy + 10, sw, sh);
    ctx.strokeRect(sx, sy + 10, sw, sh);
    ctx.beginPath();
    ctx.moveTo(sx, sy + 10 + sh); ctx.lineTo(sx + sw/2, sy + 10 + sh + 80);
    ctx.lineTo(sx + sw, sy + 10 + sh); ctx.closePath();
    ctx.fillStyle = grad; ctx.fill(); ctx.strokeStyle = '#4A5568'; ctx.stroke();
    ctx.fillStyle = '#5A6A7A'; ctx.fillRect(sx + sw/2 - 8, sy + 10 + sh + 75, 16, 20);
    ctx.strokeStyle = '#3A4A5A'; ctx.strokeRect(sx + sw/2 - 8, sy + 10 + sh + 75, 16, 20);
    ctx.strokeStyle = '#7A8A9A'; ctx.lineWidth = 2;
    for (let b = 0; b < 4; b++) { const by = sy + 40 + b * 55; ctx.beginPath(); ctx.moveTo(sx, by); ctx.lineTo(sx + sw, by); ctx.stroke(); }
    const level = 0.6 + 0.2 * Math.sin(t * 0.5 + i);
    ctx.fillStyle = 'rgba(212, 160, 86, 0.5)';
    ctx.fillRect(sx + 3, sy + 10 + sh - sh * level, sw - 6, sh * level);
    ctx.fillStyle = 'rgba(100, 180, 255, 0.3)';
    ctx.fillRect(sx + sw - 14, sy + 60, 10, 120);
    ctx.strokeStyle = '#5A6A7A'; ctx.strokeRect(sx + sw - 14, sy + 60, 10, 120);
  }
  ctx.fillStyle = C.navy; ctx.fillRect(e.x + 10, e.y, 140, 28);
  ctx.fillStyle = '#FFF'; ctx.font = 'bold 13px Arial'; ctx.textAlign = 'center';
  ctx.fillText('SILOS STOCKAGE', e.x + 80, e.y + 18);
  ctx.fillStyle = C.steel; ctx.font = '10px Arial'; ctx.fillText('2 x 50 T', e.x + 80, e.y + 42);
  ctx.restore();
}

function drawHammerMill(t) {
  const e = EQ.hammer;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(e.x + 10, e.y); ctx.lineTo(e.x + e.w - 10, e.y);
  ctx.lineTo(e.x + e.w - 20, e.y + 50); ctx.lineTo(e.x + 20, e.y + 50); ctx.closePath();
  const hopGrad = ctx.createLinearGradient(e.x, e.y, e.x + e.w, e.y);
  hopGrad.addColorStop(0, '#5A6A7A'); hopGrad.addColorStop(0.5, '#8A9AAA'); hopGrad.addColorStop(1, '#5A6A7A');
  ctx.fillStyle = hopGrad; ctx.fill(); ctx.strokeStyle = '#3A4A5A'; ctx.lineWidth = 1.5; ctx.stroke();
  const bodyY = e.y + 50, bodyH = 90;
  const bodyGrad = ctx.createLinearGradient(e.x, bodyY, e.x + e.w, bodyY);
  bodyGrad.addColorStop(0, '#4A5A6A'); bodyGrad.addColorStop(0.5, '#7A8A9A'); bodyGrad.addColorStop(1, '#4A5A6A');
  ctx.fillStyle = bodyGrad; ctx.fillRect(e.x + 5, bodyY, e.w - 10, bodyH);
  ctx.strokeStyle = '#3A4A5A'; ctx.strokeRect(e.x + 5, bodyY, e.w - 10, bodyH);
  ctx.save(); ctx.beginPath(); ctx.rect(e.x + 15, bodyY + 15, e.w - 30, bodyH - 30); ctx.clip();
  const cx = e.x + e.w/2, cy = bodyY + bodyH/2, angle = t * 8;
  ctx.strokeStyle = '#2A3A4A'; ctx.lineWidth = 3;
  for (let i = 0; i < 6; i++) {
    const a = angle + i * Math.PI / 3;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a) * 30, cy + Math.sin(a) * 30); ctx.stroke();
    ctx.fillStyle = '#3A4A5A'; ctx.fillRect(cx + Math.cos(a) * 25 - 5, cy + Math.sin(a) * 25 - 3, 12, 6);
  }
  ctx.restore();
  ctx.fillStyle = '#3A5A3A'; ctx.fillRect(e.x + e.w - 5, bodyY + 20, 30, 50);
  ctx.strokeStyle = '#2A4A2A'; ctx.strokeRect(e.x + e.w - 5, bodyY + 20, 30, 50);
  ctx.fillStyle = '#666'; ctx.fillRect(e.x + e.w - 8, bodyY + 40, 8, 10);
  ctx.fillStyle = '#5A6A7A'; ctx.fillRect(e.x + 30, bodyY + bodyH, 30, 25);
  ctx.fillStyle = C.navy; ctx.fillRect(e.x - 5, e.y - 30, e.w + 10, 24);
  ctx.fillStyle = '#FFF'; ctx.font = 'bold 12px Arial'; ctx.textAlign = 'center';
  ctx.fillText('BROYEUR', e.x + e.w/2, e.y - 12);
  ctx.restore();
}

function drawMixer(t) {
  const e = EQ.mixer;
  ctx.save();
  const grad = ctx.createLinearGradient(e.x, e.y, e.x, e.y + e.h);
  grad.addColorStop(0, '#8A9AAA'); grad.addColorStop(0.5, '#A8B8C8'); grad.addColorStop(1, '#6A7A8A');
  ctx.beginPath(); ctx.ellipse(e.x + 10, e.y + e.h/2, 12, e.h/2, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#7A8A9A'; ctx.fill(); ctx.strokeStyle = '#4A5A6A'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = grad; ctx.fillRect(e.x + 10, e.y, e.w - 20, e.h);
  ctx.strokeStyle = '#4A5A6A'; ctx.strokeRect(e.x + 10, e.y, e.w - 20, e.h);
  ctx.beginPath(); ctx.ellipse(e.x + e.w - 10, e.y + e.h/2, 12, e.h/2, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#7A8A9A'; ctx.fill(); ctx.strokeStyle = '#4A5A6A'; ctx.stroke();
  ctx.save(); ctx.beginPath(); ctx.rect(e.x + 15, e.y + 5, e.w - 30, e.h - 10); ctx.clip();
  const mcy = e.y + e.h/2;
  ctx.strokeStyle = '#555'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(e.x + 10, mcy); ctx.lineTo(e.x + e.w - 10, mcy); ctx.stroke();
  const pAngle = t * 3;
  for (let p = 0; p < 5; p++) {
    const px = e.x + 25 + p * 22, pa = pAngle + p * 0.8;
    ctx.strokeStyle = '#4A5A6A'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(px, mcy - Math.cos(pa) * 30); ctx.lineTo(px, mcy + Math.cos(pa) * 30); ctx.stroke();
  }
  ctx.restore();
  ctx.fillStyle = '#5A6A7A'; ctx.fillRect(e.x + 30, e.y - 25, 25, 28);
  ctx.strokeStyle = '#3A4A5A'; ctx.strokeRect(e.x + 30, e.y - 25, 25, 28);
  ctx.fillStyle = '#4A5A6A'; ctx.fillRect(e.x + 20, e.y + e.h, 8, 40); ctx.fillRect(e.x + e.w - 30, e.y + e.h, 8, 40);
  ctx.fillStyle = C.navy; ctx.fillRect(e.x + 5, e.y - 55, e.w - 10, 24);
  ctx.fillStyle = '#FFF'; ctx.font = 'bold 12px Arial'; ctx.textAlign = 'center';
  ctx.fillText('MELANGEUR', e.x + e.w/2, e.y - 37);
  ctx.restore();
}

function drawPreconditioner(t) {
  const e = EQ.precon;
  ctx.save();
  const grad = ctx.createLinearGradient(e.x, e.y, e.x, e.y + e.h);
  grad.addColorStop(0, '#7090A0'); grad.addColorStop(0.5, '#90B0C0'); grad.addColorStop(1, '#506A7A');
  ctx.beginPath(); ctx.ellipse(e.x + 8, e.y + e.h/2, 10, e.h/2, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#608090'; ctx.fill(); ctx.strokeStyle = '#3A5A6A'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = grad; ctx.fillRect(e.x + 8, e.y, e.w - 16, e.h);
  ctx.strokeStyle = '#3A5A6A'; ctx.strokeRect(e.x + 8, e.y, e.w - 16, e.h);
  ctx.beginPath(); ctx.ellipse(e.x + e.w - 8, e.y + e.h/2, 10, e.h/2, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#608090'; ctx.fill(); ctx.strokeStyle = '#3A5A6A'; ctx.stroke();
  ctx.save(); ctx.beginPath(); ctx.rect(e.x + 12, e.y + 5, e.w - 24, e.h - 10); ctx.clip();
  const sa = t * 4;
  for (let shaft = 0; shaft < 2; shaft++) {
    const sy = e.y + 30 + shaft * 50;
    ctx.strokeStyle = '#3A5A6A'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(e.x + 8, sy); ctx.lineTo(e.x + e.w - 8, sy); ctx.stroke();
    for (let p = 0; p < 8; p++) {
      const px = e.x + 20 + p * 17, pa = sa + p * 0.6 + shaft * Math.PI;
      ctx.fillStyle = 'rgba(58, 90, 106, 0.7)';
      ctx.save(); ctx.translate(px, sy); ctx.rotate(pa); ctx.fillRect(-2, -20, 4, 40); ctx.restore();
    }
  }
  ctx.restore();
  for (let i = 0; i < 3; i++) {
    const px = e.x + 30 + i * 40;
    ctx.fillStyle = '#506A7A'; ctx.fillRect(px, e.y - 20, 10, 22);
    ctx.strokeStyle = '#3A5A6A'; ctx.strokeRect(px, e.y - 20, 10, 22);
    ctx.beginPath(); ctx.arc(px + 5, e.y - 22, 6, 0, Math.PI * 2);
    ctx.strokeStyle = C.red; ctx.lineWidth = 2; ctx.stroke();
  }
  ctx.fillStyle = '#4A5A6A'; ctx.fillRect(e.x + 20, e.y + e.h, 8, 50); ctx.fillRect(e.x + e.w - 30, e.y + e.h, 8, 50);
  ctx.fillStyle = '#1a4a5a'; ctx.fillRect(e.x, e.y - 52, e.w, 24);
  ctx.fillStyle = '#FFF'; ctx.font = 'bold 12px Arial'; ctx.textAlign = 'center';
  ctx.fillText('PRECONDITIONNEUR', e.x + e.w/2, e.y - 34);
  ctx.fillStyle = C.steel; ctx.font = '10px Arial'; ctx.fillText('Vapeur 0.75 T/h', e.x + e.w/2, e.y - 3);
  ctx.restore();
}

function drawExtruder(t) {
  const e = EQ.extruder;
  ctx.save();
  const motorW = 60, motorH = 80, motorX = e.x, motorY = e.y + 30;
  const mGrad = ctx.createLinearGradient(motorX, motorY, motorX, motorY + motorH);
  mGrad.addColorStop(0, '#3A6A3A'); mGrad.addColorStop(0.5, '#4A8A4A'); mGrad.addColorStop(1, '#2A5A2A');
  ctx.fillStyle = mGrad; ctx.fillRect(motorX, motorY, motorW, motorH);
  ctx.strokeStyle = '#1A3A1A'; ctx.lineWidth = 2; ctx.strokeRect(motorX, motorY, motorW, motorH);
  ctx.strokeStyle = '#2A5A2A'; ctx.lineWidth = 1;
  for (let f = 0; f < 6; f++) { ctx.beginPath(); ctx.moveTo(motorX + 8 + f * 8, motorY + 5); ctx.lineTo(motorX + 8 + f * 8, motorY + motorH - 5); ctx.stroke(); }
  ctx.fillStyle = '#AAD4AA'; ctx.font = 'bold 9px Arial'; ctx.textAlign = 'center';
  ctx.fillText('203 kW', motorX + motorW/2, motorY + motorH/2 + 3);
  const gbX = motorX + motorW, gbW = 30;
  ctx.fillStyle = '#5A6A7A'; ctx.fillRect(gbX, motorY + 10, gbW, motorH - 20);
  ctx.strokeStyle = '#3A4A5A'; ctx.strokeRect(gbX, motorY + 10, gbW, motorH - 20);
  const barrelX = gbX + gbW, barrelW = e.w - motorW - gbW - 20, barrelH = 50, barrelY = e.y + 45;
  const bGrad = ctx.createLinearGradient(barrelX, barrelY, barrelX, barrelY + barrelH);
  bGrad.addColorStop(0, '#8090A0'); bGrad.addColorStop(0.3, '#A0B0C0'); bGrad.addColorStop(0.5, '#B0C0D0');
  bGrad.addColorStop(0.7, '#A0B0C0'); bGrad.addColorStop(1, '#6A7A8A');
  ctx.fillStyle = bGrad; ctx.fillRect(barrelX, barrelY, barrelW, barrelH);
  ctx.strokeStyle = '#4A5A6A'; ctx.lineWidth = 2; ctx.strokeRect(barrelX, barrelY, barrelW, barrelH);
  for (let s = 0; s < 5; s++) {
    const sx = barrelX + 5 + s * (barrelW / 5);
    ctx.strokeStyle = '#5A6A7A'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(sx, barrelY); ctx.lineTo(sx, barrelY + barrelH); ctx.stroke();
    const ti2 = 0.3 + s * 0.15 + 0.1 * Math.sin(t * 3 + s);
    ctx.fillStyle = `rgba(230, 120, 30, ${ti2})`; ctx.fillRect(sx + 2, barrelY + 2, barrelW/5 - 8, 5);
  }
  ctx.save(); ctx.beginPath(); ctx.rect(barrelX + 3, barrelY + 8, barrelW - 6, barrelH - 16); ctx.clip();
  const screwAngle = t * 6;
  for (let screw = 0; screw < 2; screw++) {
    const sy = barrelY + 18 + screw * 18;
    ctx.strokeStyle = 'rgba(90, 100, 120, 0.6)'; ctx.lineWidth = 2;
    for (let x = barrelX; x < barrelX + barrelW; x += 8) {
      const offset = screwAngle * 8 + screw * 12;
      const yOff = Math.sin((x + offset) * 0.15) * 6;
      ctx.beginPath(); ctx.moveTo(x, sy + yOff - 5); ctx.lineTo(x + 4, sy - yOff + 5); ctx.stroke();
    }
  }
  ctx.restore();
  const dieX = barrelX + barrelW;
  ctx.fillStyle = '#4A5A6A'; ctx.fillRect(dieX, barrelY - 5, 15, barrelH + 10);
  ctx.strokeStyle = '#2A3A4A'; ctx.strokeRect(dieX, barrelY - 5, 15, barrelH + 10);
  for (let d = 0; d < 4; d++) { ctx.beginPath(); ctx.arc(dieX + 8, barrelY + 10 + d * 12, 3, 0, Math.PI * 2); ctx.fillStyle = '#1A2A3A'; ctx.fill(); }
  ctx.beginPath(); ctx.moveTo(barrelX + 5, barrelY); ctx.lineTo(barrelX - 5, barrelY - 40);
  ctx.lineTo(barrelX + 35, barrelY - 40); ctx.lineTo(barrelX + 25, barrelY); ctx.closePath();
  ctx.fillStyle = '#6A7A8A'; ctx.fill(); ctx.strokeStyle = '#4A5A6A'; ctx.stroke();
  ctx.fillStyle = '#3A4A5A';
  ctx.fillRect(motorX + 10, motorY + motorH, 8, FLOOR_Y - motorY - motorH);
  ctx.fillRect(barrelX + barrelW/2, barrelY + barrelH, 8, FLOOR_Y - barrelY - barrelH);
  ctx.fillRect(dieX, barrelY + barrelH + 5, 8, FLOOR_Y - barrelY - barrelH - 5);
  ctx.fillStyle = '#2A3A4A'; ctx.fillRect(motorX, FLOOR_Y - 10, e.w, 10);
  ctx.fillStyle = C.teal; ctx.fillRect(e.x + 30, e.y - 10, 180, 28);
  ctx.fillStyle = '#FFF'; ctx.font = 'bold 13px Arial'; ctx.textAlign = 'center';
  ctx.fillText('EXTRUDEUSE BI-VIS SJPS165', e.x + 120, e.y + 10);
  ctx.fillStyle = C.steel; ctx.font = '10px Arial'; ctx.fillText('5 T/h  |  Fourreau 145 C', e.x + 120, e.y + 24);
  ctx.restore();
}

function drawDryer(t) {
  const e = EQ.dryer;
  ctx.save();
  const grad = ctx.createLinearGradient(e.x, e.y, e.x, e.y + e.h);
  grad.addColorStop(0, '#7A6A5A'); grad.addColorStop(0.5, '#9A8A7A'); grad.addColorStop(1, '#6A5A4A');
  ctx.fillStyle = grad; ctx.fillRect(e.x, e.y + 20, e.w, e.h - 20);
  ctx.strokeStyle = '#4A3A2A'; ctx.lineWidth = 2; ctx.strokeRect(e.x, e.y + 20, e.w, e.h - 20);
  ctx.save(); ctx.beginPath(); ctx.rect(e.x + 10, e.y + 30, e.w - 20, e.h - 40); ctx.clip();
  for (let belt = 0; belt < 3; belt++) {
    const by = e.y + 50 + belt * 55;
    ctx.fillStyle = 'rgba(80, 90, 70, 0.6)'; ctx.fillRect(e.x + 15, by, e.w - 30, 8);
    const dir = belt % 2 === 0 ? 1 : -1;
    ctx.strokeStyle = 'rgba(60, 70, 50, 0.5)'; ctx.lineWidth = 1;
    for (let seg = 0; seg < 12; seg++) {
      const sx = e.x + 20 + ((seg * 20 + t * 30 * dir) % (e.w - 40));
      if (sx > e.x + 15 && sx < e.x + e.w - 20) { ctx.beginPath(); ctx.moveTo(sx, by + 1); ctx.lineTo(sx + 6 * dir, by + 1); ctx.stroke(); }
    }
    for (let k = 0; k < 8; k++) {
      const kx = e.x + 20 + ((k * 28 + t * 25 * dir) % (e.w - 50));
      if (kx > e.x + 15 && kx < e.x + e.w - 25) { ctx.fillStyle = C.kibble; ctx.beginPath(); ctx.arc(kx, by - 3, 3, 0, Math.PI * 2); ctx.fill(); }
    }
    ctx.fillStyle = '#3A4A3A';
    ctx.beginPath(); ctx.arc(e.x + 18, by + 4, 6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(e.x + e.w - 18, by + 4, 6, 0, Math.PI * 2); ctx.fill();
  }
  ctx.strokeStyle = 'rgba(230, 140, 60, 0.3)'; ctx.lineWidth = 1;
  for (let hw = 0; hw < 6; hw++) {
    const hx = e.x + 30 + hw * 38;
    ctx.beginPath();
    for (let y = e.y + 35; y < e.y + e.h - 15; y += 3) {
      const xOff = Math.sin((y + t * 40) * 0.1) * 4;
      if (y === e.y + 35) ctx.moveTo(hx + xOff, y); else ctx.lineTo(hx + xOff, y);
    }
    ctx.stroke();
  }
  ctx.restore();
  ctx.fillStyle = '#5A4A3A'; ctx.fillRect(e.x + e.w/2 - 15, e.y - 20, 30, 42);
  ctx.strokeStyle = '#3A2A1A'; ctx.strokeRect(e.x + e.w/2 - 15, e.y - 20, 30, 42);
  ctx.fillStyle = '#4A3A2A'; ctx.beginPath();
  ctx.moveTo(e.x + e.w/2 - 20, e.y - 20); ctx.lineTo(e.x + e.w/2, e.y - 35); ctx.lineTo(e.x + e.w/2 + 20, e.y - 20);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#4A3A2A';
  ctx.fillRect(e.x + 15, e.y + e.h, 10, FLOOR_Y - e.y - e.h);
  ctx.fillRect(e.x + e.w - 25, e.y + e.h, 10, FLOOR_Y - e.y - e.h);
  ctx.fillRect(e.x + e.w/2, e.y + e.h, 10, FLOOR_Y - e.y - e.h);
  ctx.fillStyle = C.amber; ctx.fillRect(e.x + 30, e.y - 55, 200, 28);
  ctx.fillStyle = '#FFF'; ctx.font = 'bold 13px Arial'; ctx.textAlign = 'center';
  ctx.fillText('SECHOIR A BANDES GZDH2200', e.x + 130, e.y - 37);
  ctx.fillStyle = C.steel; ctx.font = '10px Arial';
  ctx.fillText('Entree 140 C  |  Tapis 44 m2', e.x + 130, e.y - 23);
  ctx.restore();
}

function drawCooler(t) {
  const e = EQ.cooler;
  ctx.save();
  const grad = ctx.createLinearGradient(e.x, e.y, e.x + e.w, e.y);
  grad.addColorStop(0, '#5A7A9A'); grad.addColorStop(0.3, '#8AAABA'); grad.addColorStop(0.5, '#9ABACA');
  grad.addColorStop(0.7, '#8AAABA'); grad.addColorStop(1, '#5A7A9A');
  ctx.beginPath(); ctx.ellipse(e.x + e.w/2, e.y + 20, e.w/2, 20, 0, Math.PI, 0);
  ctx.fillStyle = grad; ctx.fill(); ctx.strokeStyle = '#3A5A7A'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = grad; ctx.fillRect(e.x, e.y + 20, e.w, e.h - 80);
  ctx.strokeStyle = '#3A5A7A'; ctx.strokeRect(e.x, e.y + 20, e.w, e.h - 80);
  ctx.beginPath(); ctx.moveTo(e.x, e.y + e.h - 60); ctx.lineTo(e.x + e.w/2, e.y + e.h);
  ctx.lineTo(e.x + e.w, e.y + e.h - 60); ctx.closePath();
  ctx.fillStyle = grad; ctx.fill(); ctx.strokeStyle = '#3A5A7A'; ctx.stroke();
  ctx.fillStyle = '#4A6A8A'; ctx.fillRect(e.x + e.w/2 - 10, e.y + e.h - 5, 20, 20);
  ctx.strokeStyle = '#2A4A6A'; ctx.strokeRect(e.x + e.w/2 - 10, e.y + e.h - 5, 20, 20);
  ctx.strokeStyle = 'rgba(58, 90, 122, 0.5)'; ctx.lineWidth = 1;
  for (let b = 0; b < 5; b++) {
    const by = e.y + 50 + b * 45;
    ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.moveTo(e.x + 8, by); ctx.lineTo(e.x + e.w - 8, by); ctx.stroke();
  }
  ctx.setLineDash([]);
  ctx.strokeStyle = 'rgba(100, 180, 255, 0.4)'; ctx.lineWidth = 2;
  for (let a = 0; a < 4; a++) {

function drawBoiler(t) {
  const e = EQ.boiler;
  ctx.save();
  // Horizontal fire-tube boiler body
  const bodyX = e.x + 20, bodyY = e.y + 15, bodyW = e.w - 40, bodyH = e.h - 40;
  const bGrad = ctx.createLinearGradient(bodyX, bodyY, bodyX, bodyY + bodyH);
  bGrad.addColorStop(0, '#8A3030'); bGrad.addColorStop(0.3, '#B04040'); bGrad.addColorStop(0.5, '#C04848');
  bGrad.addColorStop(0.7, '#B04040'); bGrad.addColorStop(1, '#7A2828');
  // Left endcap
  ctx.beginPath(); ctx.ellipse(bodyX, bodyY + bodyH/2, 14, bodyH/2, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#8A3030'; ctx.fill(); ctx.strokeStyle = '#5A1818'; ctx.lineWidth = 2; ctx.stroke();
  // Main body
  ctx.fillStyle = bGrad; ctx.fillRect(bodyX, bodyY, bodyW, bodyH);
  ctx.strokeStyle = '#5A1818'; ctx.strokeRect(bodyX, bodyY, bodyW, bodyH);
  // Right endcap
  ctx.beginPath(); ctx.ellipse(bodyX + bodyW, bodyY + bodyH/2, 14, bodyH/2, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#8A3030'; ctx.fill(); ctx.strokeStyle = '#5A1818'; ctx.stroke();
  // Reinforcement bands
  ctx.strokeStyle = '#6A2020'; ctx.lineWidth = 2;
  for (let b = 0; b < 4; b++) {
    const bx = bodyX + 25 + b * 35;
    ctx.beginPath(); ctx.moveTo(bx, bodyY); ctx.lineTo(bx, bodyY + bodyH); ctx.stroke();
  }
  // Pressure gauge on top
  ctx.beginPath(); ctx.arc(bodyX + bodyW * 0.3, bodyY - 5, 12, 0, Math.PI * 2);
  ctx.fillStyle = '#222'; ctx.fill(); ctx.strokeStyle = '#555'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.beginPath(); ctx.arc(bodyX + bodyW * 0.3, bodyY - 5, 8, 0, Math.PI * 2);
  ctx.fillStyle = '#EEE'; ctx.fill();
  // Needle animated
  const needleA = -Math.PI * 0.7 + Math.sin(t * 0.3) * 0.15 + Math.PI * 0.5;
  ctx.strokeStyle = C.red; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(bodyX + bodyW * 0.3, bodyY - 5);
  ctx.lineTo(bodyX + bodyW * 0.3 + Math.cos(needleA) * 6, bodyY - 5 + Math.sin(needleA) * 6);
  ctx.stroke();
  // Safety valve on top
  ctx.fillStyle = '#D4A020'; ctx.fillRect(bodyX + bodyW * 0.6, bodyY - 18, 12, 20);
  ctx.strokeStyle = '#A08010'; ctx.strokeRect(bodyX + bodyW * 0.6, bodyY - 18, 12, 20);
  // Steam outlet pipe (goes up)
  ctx.fillStyle = '#8A3030'; ctx.fillRect(bodyX + bodyW * 0.8, bodyY - 30, 14, 32);
  ctx.strokeStyle = '#5A1818'; ctx.strokeRect(bodyX + bodyW * 0.8, bodyY - 30, 14, 32);
  // Flue/chimney at back
  ctx.fillStyle = '#4A4A4A'; ctx.fillRect(bodyX + bodyW - 5, bodyY - 45, 20, 47);
  ctx.strokeStyle = '#2A2A2A'; ctx.strokeRect(bodyX + bodyW - 5, bodyY - 45, 20, 47);
  // Chimney cap
  ctx.fillStyle = '#3A3A3A';
  ctx.beginPath();
  ctx.moveTo(bodyX + bodyW - 10, bodyY - 45); ctx.lineTo(bodyX + bodyW + 5, bodyY - 58);
  ctx.lineTo(bodyX + bodyW + 20, bodyY - 45); ctx.closePath(); ctx.fill(); ctx.stroke();
  // Fire glow at bottom
  const fireGlow = 0.3 + 0.15 * Math.sin(t * 4);
  ctx.fillStyle = `rgba(255, 120, 30, ${fireGlow})`;
  ctx.fillRect(bodyX + 10, bodyY + bodyH - 8, bodyW - 20, 8);
  // Burner inlet
  ctx.fillStyle = '#5A5A5A'; ctx.fillRect(e.x, bodyY + bodyH/2 - 8, 22, 16);
  ctx.strokeStyle = '#3A3A3A'; ctx.strokeRect(e.x, bodyY + bodyH/2 - 8, 22, 16);
  // Flame animation in burner
  for (let f = 0; f < 3; f++) {
    const fx = e.x + 8 + f * 5;
    const fh = 8 + Math.sin(t * 8 + f * 2) * 4;
    ctx.fillStyle = `rgba(255, ${150 + f * 30}, 30, 0.7)`;
    ctx.beginPath(); ctx.moveTo(fx, bodyY + bodyH/2 + 5); ctx.lineTo(fx + 3, bodyY + bodyH/2 - fh);
    ctx.lineTo(fx + 6, bodyY + bodyH/2 + 5); ctx.closePath(); ctx.fill();
  }
  // Water level sight glass
  ctx.fillStyle = 'rgba(60, 120, 200, 0.4)';
  const wLevel = 0.55 + 0.05 * Math.sin(t * 0.4);
  ctx.fillRect(bodyX + bodyW + 5, bodyY + bodyH * (1 - wLevel), 8, bodyH * wLevel);
  ctx.strokeStyle = '#5A1818'; ctx.strokeRect(bodyX + bodyW + 5, bodyY, 8, bodyH);
  // Support legs
  ctx.fillStyle = '#4A3030';
  ctx.fillRect(bodyX + 15, bodyY + bodyH, 10, 22); ctx.fillRect(bodyX + bodyW - 25, bodyY + bodyH, 10, 22);
  // Smoke from chimney
  for (let s = 0; s < 5; s++) {
    const age = (t * 0.4 + s * 0.5) % 2;
    if (age < 1.5) {
      const sx = bodyX + bodyW + 5 + Math.sin(age * 2 + s) * 8;
      const sy = bodyY - 58 - age * 30;
      const alpha = (1 - age / 1.5) * 0.25;
      ctx.fillStyle = `rgba(100, 100, 110, ${alpha})`;
      ctx.beginPath(); ctx.arc(sx, sy, 4 + age * 6, 0, Math.PI * 2); ctx.fill();
    }
  }
  // Label
  ctx.fillStyle = C.red; ctx.fillRect(e.x + 15, e.y - 25, e.w - 30, 28);
  ctx.fillStyle = '#FFF'; ctx.font = 'bold 13px Arial'; ctx.textAlign = 'center';
  ctx.fillText('CHAUDIERE A VAPEUR', e.x + e.w/2, e.y - 7);
  ctx.fillStyle = '#FFB0B0'; ctx.font = '10px Arial';
  ctx.fillText('4 T/h  |  10 bar  |  Gaz naturel', e.x + e.w/2, e.y + 7);
  ctx.restore();
}

function drawCompressor(t) {
  const e = EQ.compressor;

  const tankX = e.x + 80, tankY = e.y + 20, tankW = 70, tankH = 55;
  const tGrad = ctx.createLinearGradient(tankX, tankY, tankX, tankY + tankH);

  for (let f = 0; f < 5; f++) {

  ctx.fillStyle = '#4A5A6A'; ctx.fillRect(pumpX + pumpW - 2, compY + compH/2 - 5, tankX - pumpX - pumpW + 5, 10);
  ctx.strokeStyle = '#3A4A5A'; ctx.strokeRect(pumpX + pumpW - 2, compY + compH/2 - 5, tankX - pumpX - pumpW + 5, 10);
  // Air outlet pipe going up
  ctx.fillStyle = '#4A6A8A'; ctx.fillRect(tankX + tankW/2 - 5, tankY - 30, 10, 30);
  ctx.strokeStyle = '#2A4A6A'; ctx.strokeRect(tankX + tankW/2 - 5, tankY - 30, 10, 30);

  ctx.fillRect(e.x + e.w - 20, e.y + e.h - 5, 8, 15);

  ctx.fillStyle = '#FFF'; ctx.font = 'bold 13px Arial'; ctx.textAlign = 'center';
  ctx.fillText('COMPRESSEUR D\'AIR', e.x + e.w/2, e.y - 7);

  ctx.fillText('8 bar  |  55 kW  |  Vis rotative', e.x + e.w/2, e.y + 7);

function drawUtilityPipes(t) {
  ctx.save();
  // Steam pipe: boiler to preconditioner (red dashed)
  const bSteamX = EQ.boiler.x + EQ.boiler.w * 0.8 + 7;
  const bSteamY = EQ.boiler.y + 15 - 30;
  const pSteamX = EQ.precon.x + 70;
  const pSteamY = EQ.precon.y + EQ.precon.h + 5;
  // Red steam pipe
  ctx.strokeStyle = '#AA3030'; ctx.lineWidth = 6; ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(bSteamX, bSteamY);
  ctx.lineTo(bSteamX, pSteamY + 30); ctx.lineTo(pSteamX, pSteamY + 30); ctx.lineTo(pSteamX, pSteamY); ctx.stroke();
  ctx.strokeStyle = '#CC5050'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(bSteamX, bSteamY);
  ctx.lineTo(bSteamX, pSteamY + 30); ctx.lineTo(pSteamX, pSteamY + 30); ctx.lineTo(pSteamX, pSteamY); ctx.stroke();
  // Steam flow particles
  const sDist = Math.abs(bSteamY - pSteamY - 30) + Math.abs(bSteamX - pSteamX) + 30;
  for (let p = 0; p < 8; p++) {
    const prog = ((p / 8 + t * 0.1) % 1);
    const totalL = Math.abs(pSteamY + 30 - bSteamY) + Math.abs(pSteamX - bSteamX) + 30;
    const leg1 = Math.abs(pSteamY + 30 - bSteamY) / totalL;
    const leg2 = (Math.abs(pSteamX - bSteamX)) / totalL;
    let px, py;
    if (prog < leg1) { px = bSteamX; py = lerp(bSteamY, pSteamY + 30, prog / leg1); }
    else if (prog < leg1 + leg2) { px = lerp(bSteamX, pSteamX, (prog - leg1) / leg2); py = pSteamY + 30; }
    else { px = pSteamX; py = lerp(pSteamY + 30, pSteamY, (prog - leg1 - leg2) / (1 - leg1 - leg2)); }
    ctx.fillStyle = 'rgba(255, 100, 80, 0.6)';
    ctx.beginPath(); ctx.arc(px, py, 2.5, 0, Math.PI * 2); ctx.fill();
  }
  // Steam pipe label
  ctx.fillStyle = 'rgba(170, 48, 48, 0.8)'; ctx.font = 'bold 9px Arial'; ctx.textAlign = 'center';
  ctx.fillText('VAPEUR 10 bar', (bSteamX + pSteamX) / 2, pSteamY + 26);

  // Steam pipe: boiler to dryer
  const dSteamX = EQ.dryer.x + 60;
  const dSteamY = EQ.dryer.y + EQ.dryer.h + 5;
  ctx.strokeStyle = '#AA3030'; ctx.lineWidth = 6; ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(bSteamX + 15, bSteamY + 10);
  ctx.lineTo(bSteamX + 15, pSteamY + 45); ctx.lineTo(dSteamX, pSteamY + 45); ctx.lineTo(dSteamX, dSteamY); ctx.stroke();
  ctx.strokeStyle = '#CC5050'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(bSteamX + 15, bSteamY + 10);
  ctx.lineTo(bSteamX + 15, pSteamY + 45); ctx.lineTo(dSteamX, pSteamY + 45); ctx.lineTo(dSteamX, dSteamY); ctx.stroke();
  ctx.fillStyle = 'rgba(170, 48, 48, 0.8)'; ctx.font = 'bold 9px Arial';
  ctx.fillText('VAPEUR SECHOIR', (bSteamX + 15 + dSteamX) / 2, pSteamY + 41);
  // Flow particles on dryer steam pipe
  for (let p = 0; p < 6; p++) {
    const prog = ((p / 6 + t * 0.08) % 1);
    const seg1Y = pSteamY + 45, seg2X = dSteamX;
    const l1 = Math.abs(seg1Y - bSteamY - 10), l2 = Math.abs(dSteamX - bSteamX - 15), l3 = Math.abs(dSteamY - seg1Y);
    const total = l1 + l2 + l3;
    let px, py;
    if (prog < l1/total) { px = bSteamX + 15; py = lerp(bSteamY + 10, seg1Y, prog / (l1/total)); }
    else if (prog < (l1+l2)/total) { px = lerp(bSteamX + 15, dSteamX, (prog - l1/total) / (l2/total)); py = seg1Y; }
    else { px = dSteamX; py = lerp(seg1Y, dSteamY, (prog - (l1+l2)/total) / (l3/total)); }
    ctx.fillStyle = 'rgba(255, 100, 80, 0.5)';
    ctx.beginPath(); ctx.arc(px, py, 2, 0, Math.PI * 2); ctx.fill();
  }

  // Air pipe: compressor to cooler (blue)
  const cAirX = EQ.compressor.x + 115;
  const cAirY = EQ.compressor.y + 20 - 30;
  const coolerAirX = EQ.cooler.x - 25;
  const coolerAirY = EQ.cooler.y + EQ.cooler.h - 100;
  ctx.strokeStyle = '#2A5A9A'; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(cAirX, cAirY);
  ctx.lineTo(cAirX, coolerAirY); ctx.lineTo(coolerAirX + 25, coolerAirY); ctx.stroke();
  ctx.strokeStyle = '#4A8ACA'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(cAirX, cAirY);
  ctx.lineTo(cAirX, coolerAirY); ctx.lineTo(coolerAirX + 25, coolerAirY); ctx.stroke();
  ctx.fillStyle = 'rgba(42, 90, 154, 0.8)'; ctx.font = 'bold 9px Arial';
  ctx.fillText('AIR 8 bar', (cAirX + coolerAirX + 25) / 2, coolerAirY - 5);
  // Flow particles
  for (let p = 0; p < 5; p++) {
    const prog = ((p / 5 + t * 0.12) % 1);
    const l1 = Math.abs(coolerAirY - cAirY), l2 = Math.abs(coolerAirX + 25 - cAirX);
    const total = l1 + l2;
    let px, py;
    if (prog < l1/total) { px = cAirX; py = lerp(cAirY, coolerAirY, prog / (l1/total)); }
    else { px = lerp(cAirX, coolerAirX + 25, (prog - l1/total) / (l2/total)); py = coolerAirY; }
    ctx.fillStyle = 'rgba(80, 150, 220, 0.6)';
    ctx.beginPath(); ctx.arc(px, py, 2, 0, Math.PI * 2); ctx.fill();
  }

  // Air pipe: compressor to packer (pneumatics)
  const packAirX = EQ.packer.x + 20;
  const packAirY = EQ.packer.y + EQ.packer.h - 20;
  ctx.strokeStyle = '#2A5A9A'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(cAirX + 20, cAirY + 15);
  ctx.lineTo(cAirX + 20, packAirY + 20); ctx.lineTo(packAirX, packAirY + 20); ctx.lineTo(packAirX, packAirY); ctx.stroke();
  ctx.strokeStyle = '#4A8ACA'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(cAirX + 20, cAirY + 15);
  ctx.lineTo(cAirX + 20, packAirY + 20); ctx.lineTo(packAirX, packAirY + 20); ctx.lineTo(packAirX, packAirY); ctx.stroke();
  ctx.fillStyle = 'rgba(42, 90, 154, 0.7)'; ctx.font = 'bold 8px Arial';
  ctx.fillText('AIR PNEUMATIQUE', (cAirX + 20 + packAirX) / 2, packAirY + 16);

  ctx.setLineDash([]);
  ctx.restore();
}

function drawPipe(x1, y1, x2, y2, t, color) {
  ctx.save();
  const midX = (x1 + x2) / 2;
  const tall = Math.abs(y2 - y1) > 30;
  ctx.strokeStyle = '#5A6A7A'; ctx.lineWidth = 8; ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x1, y1);
  if (tall) { ctx.lineTo(midX, y1); ctx.lineTo(midX, y2); ctx.lineTo(x2, y2); } else { ctx.lineTo(x2, y2); }
  ctx.stroke();
  ctx.strokeStyle = '#7A8A9A'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(x1, y1);
  if (tall) { ctx.lineTo(midX, y1); ctx.lineTo(midX, y2); ctx.lineTo(x2, y2); } else { ctx.lineTo(x2, y2); }
  ctx.stroke();
  const dist = Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2);
  const numP = Math.floor(dist / 25);
  for (let p = 0; p < numP; p++) {
    const prog = ((p / numP + t * 0.15) % 1);
    let px, py;
    if (tall) {
      if (prog < 0.33) { px = lerp(x1, midX, prog / 0.33); py = y1; }
      else if (prog < 0.66) { px = midX; py = lerp(y1, y2, (prog - 0.33) / 0.33); }
      else { px = lerp(midX, x2, (prog - 0.66) / 0.33); py = y2; }
    } else { px = lerp(x1, x2, prog); py = lerp(y1, y2, prog); }
    ctx.fillStyle = color; ctx.beginPath(); ctx.arc(px, py, 2.5, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function drawBucketElevator(x1, y1, x2, y2, t) {
  ctx.save();
  const ex = (x1 + x2) / 2;
  const topY = Math.min(y1, y2) - 20, botY = Math.max(y1, y2) + 10;
  ctx.fillStyle = '#4A5A6A'; ctx.fillRect(ex - 10, topY, 20, botY - topY);
  ctx.strokeStyle = '#3A4A5A'; ctx.strokeRect(ex - 10, topY, 20, botY - topY);
  for (let b = 0; b < 5; b++) {
    const by = topY + ((b * 40 + t * 40) % (botY - topY));
    ctx.fillStyle = '#6A7A8A'; ctx.fillRect(ex - 6, by, 12, 8);
    ctx.fillStyle = C.kibble; ctx.fillRect(ex - 4, by + 1, 8, 4);
  }
  ctx.fillStyle = '#5A6A7A'; ctx.fillRect(x1, y1 - 4, ex - x1, 8); ctx.fillRect(ex, topY - 4, x2 - ex + 10, 8);
  ctx.restore();
}

function drawConveyors(t) {
  ctx.save();
  drawPipe(EQ.silos.x + 100, FLOOR_Y - 30, EQ.hammer.x + 45, EQ.hammer.y + 5, t, C.grain);
  drawPipe(EQ.hammer.x + 45, EQ.hammer.y + 165, EQ.mixer.x + 42, EQ.mixer.y - 22, t, C.grain);
  drawPipe(EQ.mixer.x + EQ.mixer.w - 10, EQ.mixer.y + 50, EQ.precon.x + 10, EQ.precon.y + 55, t, C.grain);
  drawPipe(EQ.precon.x + EQ.precon.w - 5, EQ.precon.y + 55, 810 + 5, EQ.extruder.y + 5, t, C.grain);
  drawPipe(EQ.extruder.x + EQ.extruder.w - 15, EQ.extruder.y + 60, EQ.dryer.x + 5, EQ.dryer.y + 60, t, C.kibble);
  drawBucketElevator(EQ.dryer.x + EQ.dryer.w - 10, EQ.dryer.y + 80, EQ.cooler.x + 10, EQ.cooler.y + 30, t);
  drawPipe(EQ.cooler.x + EQ.cooler.w - 5, EQ.cooler.y + EQ.cooler.h - 30, EQ.coater.x + 12, EQ.coater.y + 60, t, C.kibble);
  drawPipe(EQ.coater.x + EQ.coater.w - 8, EQ.coater.y + 60, EQ.packer.x + 20, EQ.packer.y + 5, t, C.kibble);
  ctx.restore();
}

function drawSteamEffects(t) {
  ctx.save();
  for (let s = 0; s < 12; s++) {
    const baseX = EQ.precon.x + 20 + s * 12;
    const age = (t * 0.6 + s * 0.3) % 2;
    if (age < 1.5) {
      const sy = EQ.precon.y - 20 - age * 40, alpha = (1 - age / 1.5) * 0.35, size = 4 + age * 8;
      ctx.fillStyle = `rgba(200, 220, 240, ${alpha})`;
      ctx.beginPath(); ctx.arc(baseX + Math.sin(age * 3 + s) * 10, sy, size, 0, Math.PI * 2); ctx.fill();
    }
  }
  for (let s = 0; s < 8; s++) {
    const baseX = EQ.dryer.x + EQ.dryer.w/2;
    const age = (t * 0.5 + s * 0.4) % 2.5;
    if (age < 2) {
      const sy = EQ.dryer.y - 35 - age * 35, alpha = (1 - age / 2) * 0.4, size = 5 + age * 10;
      ctx.fillStyle = `rgba(180, 200, 220, ${alpha})`;
      ctx.beginPath(); ctx.arc(baseX + Math.sin(age * 2 + s) * 15, sy, size, 0, Math.PI * 2); ctx.fill();
    }
  }
  const dieX = EQ.extruder.x + EQ.extruder.w - 15;
  for (let h = 0; h < 5; h++) {
    const age = (t * 0.8 + h * 0.5) % 1.5;
    const hx = dieX + 15 + age * 15, hy = EQ.extruder.y + 50 + Math.sin(age * 8 + h) * 15;
    const alpha = (1 - age / 1.5) * 0.3;
    ctx.fillStyle = `rgba(255, 180, 80, ${alpha})`;
    ctx.beginPath(); ctx.arc(hx, hy, 3 + age * 4, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

  tempData.forEach((v, i) => {
    const noise = Math.sin(t * 2 + i) * 3;
    const x = tChartX + tPadL + (i / (tempData.length - 1)) * tPlotW;
    const y = tChartY2 + tPadT + tPlotH - ((v + noise) / 150) * tPlotH;

function drawFlowArrows(t) {

}

function getPhaseAlpha(t, st, fd) { if (t < st) return 0; if (t < st + fd) return (t - st) / fd; return 1; }

function render(timestamp) {
  if (!startTime) startTime = timestamp;
  const elapsed = (timestamp - startTime) / 1000;
  if (elapsed > DURATION + 1) { document.title = 'DONE'; return; }
  const t = elapsed;
  let globalAlpha = 1;
  if (t < 1) globalAlpha = t;
  if (t > DURATION - 1) globalAlpha = Math.max(0, DURATION - t);
  ctx.globalAlpha = globalAlpha;
  drawBackground(t);
  drawHeader(t);
  const equipAlpha = getPhaseAlpha(t, 0.5, 1.5);
  const convAlpha = getPhaseAlpha(t, 1.5, 1);
  const utilAlpha = getPhaseAlpha(t, 3, 1.5);
  const utilPipeAlpha = getPhaseAlpha(t, 4, 1);
  const dashAlpha = getPhaseAlpha(t, 5, 1);
  const effectAlpha = getPhaseAlpha(t, 2, 1);
  ctx.globalAlpha = globalAlpha * equipAlpha;
  drawSilos(t); drawHammerMill(t); drawMixer(t); drawPreconditioner(t);
  drawExtruder(t); drawDryer(t); drawCooler(t); drawCoater(t); drawPacker(t);
  ctx.globalAlpha = globalAlpha * convAlpha;
  drawConveyors(t); drawFlowArrows(t);
  ctx.globalAlpha = globalAlpha * utilAlpha;
  drawBoiler(t); drawCompressor(t);
  ctx.globalAlpha = globalAlpha * utilPipeAlpha;
  drawUtilityPipes(t);
  ctx.globalAlpha = globalAlpha * effectAlpha;
  drawSteamEffects(t);
  ctx.globalAlpha = globalAlpha * dashAlpha;
  drawDashboard(t);
  ctx.globalAlpha = 1;
  requestAnimationFrame(render);
}

requestAnimationFrame(render);
</script>
